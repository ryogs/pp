<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>admin</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: #fff;
  color: #111;
  font-family: "Geist", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font-family: inherit; font-size: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; text-decoration: none; }

/* ── Login ──────────────────────────────────────────────────────────────── */
#loginScreen {
  position: fixed; inset: 0;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
}
.login-inner {
  width: min(320px, 88vw);
}
.login-site {
  font-family: "Geist Mono", monospace;
  font-size: 11px; letter-spacing: 0.04em; color: #aaa;
  margin-bottom: 32px;
}
.login-row {
  display: flex; align-items: baseline; gap: 12px;
  border-bottom: 1px solid #e8e8e8;
  padding: 10px 0;
}
.login-row:first-of-type { border-top: 1px solid #e8e8e8; }
.login-row label {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.06em; color: #bbb;
  width: 60px; flex-shrink: 0;
}
.login-row input {
  flex: 1; border: none; outline: none;
  font-size: 14px; font-weight: 300; color: #111;
  background: transparent;
}
.login-actions {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 20px;
}
.login-error {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #c00; min-height: 14px;
}
.btn-submit {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.08em;
  color: #111; border: 1px solid #e0e0e0;
  padding: 7px 16px; border-radius: 2px;
  transition: border-color 120ms, color 120ms;
}
.btn-submit:hover { border-color: #111; }
.btn-submit:disabled { color: #ccc; border-color: #eee; cursor: not-allowed; }

/* ── App ────────────────────────────────────────────────────────────────── */
#app { display: none; }
#app.visible { display: block; }

/* ── Header ─────────────────────────────────────────────────────────────── */
.header {
  display: flex; align-items: center;
  padding: 0 20px;
  height: 44px;
  border-bottom: 1px solid #e8e8e8;
}
.header-title {
  font-family: "Geist Mono", monospace;
  font-size: 11px; letter-spacing: 0.04em; color: #aaa;
}
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 20px; }
.header-tab {
  font-family: "Geist Mono", monospace;
  font-size: 11px; letter-spacing: 0.04em;
  color: #bbb; padding: 4px 0;
  border-bottom: 1px solid transparent;
  transition: color 120ms, border-color 120ms;
}
.header-tab.active { color: #111; border-bottom-color: #111; }
.header-tab:hover:not(.active) { color: #555; }
.header-signout {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.04em; color: #ccc;
  transition: color 120ms;
}
.header-signout:hover { color: #111; }

/* ── Panels ─────────────────────────────────────────────────────────────── */
.panel { display: none; max-width: 680px; margin: 0 auto; padding: 0 20px 80px; }
.panel.active { display: block; }

/* ── Section label ──────────────────────────────────────────────────────── */
.section-label {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.08em; color: #bbb;
  padding: 20px 0 10px;
  border-bottom: 1px solid #f0f0f0;
  margin-bottom: 0;
  text-transform: uppercase;
}

/* ── Inline form ────────────────────────────────────────────────────────── */
.form-row {
  display: flex; align-items: baseline; gap: 12px;
  border-bottom: 1px solid #f0f0f0;
  padding: 11px 0;
}
.form-label {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.04em; color: #ccc;
  width: 72px; flex-shrink: 0; padding-top: 1px;
}
.form-input {
  flex: 1; border: none; outline: none;
  font-size: 14px; font-weight: 300; color: #111;
  background: transparent;
}
.form-input::placeholder { color: #ddd; }
.form-textarea {
  flex: 1; border: none; outline: none; resize: none;
  font-size: 14px; font-weight: 300; color: #111; line-height: 1.5;
  background: transparent; min-height: 56px;
  overflow: hidden;
}
.form-textarea::placeholder { color: #ddd; }

/* Tags */
.tags-row {
  display: flex; align-items: flex-start; gap: 12px;
  border-bottom: 1px solid #f0f0f0;
  padding: 9px 0;
  flex-wrap: wrap;
}
.tags-chips {
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center; flex: 1;
}
.tag-chip {
  font-family: "Geist Mono", monospace;
  font-size: 9px; letter-spacing: 0.06em;
  color: #888; border: 1px solid #e0e0e0; border-radius: 2px;
  padding: 2px 7px; display: flex; align-items: center; gap: 4px;
}
.tag-chip-rm { color: #ccc; font-size: 11px; cursor: pointer; }
.tag-chip-rm:hover { color: #888; }
.tags-input-inline {
  border: none; outline: none; background: transparent;
  font-size: 13px; font-weight: 300; color: #111;
  min-width: 80px;
}
.tags-input-inline::placeholder { color: #ddd; }

/* File row */
.file-row {
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid #f0f0f0;
  padding: 11px 0;
}
.file-label-col {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.04em; color: #ccc;
  width: 72px; flex-shrink: 0;
}
.file-pick {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.04em; color: #aaa;
  border: 1px solid #e8e8e8; border-radius: 2px;
  padding: 5px 12px; cursor: pointer;
  transition: border-color 120ms, color 120ms;
  position: relative; overflow: hidden;
}
.file-pick:hover { border-color: #bbb; color: #555; }
.file-pick input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}
.file-name {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #888; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.file-clear {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #ccc;
  transition: color 120ms;
}
.file-clear:hover { color: #c00; }

/* Preview */
.file-preview {
  padding: 8px 0 4px 84px;
  display: none;
}
.file-preview img, .file-preview video {
  max-height: 140px; max-width: 100%;
  border: 1px solid #f0f0f0; border-radius: 2px;
  display: block;
}

/* Progress */
.progress-row {
  padding: 4px 0 4px 84px;
  display: none;
}
.progress-track {
  height: 1px; background: #f0f0f0; border-radius: 1px;
}
.progress-fill {
  height: 100%; background: #111; border-radius: 1px;
  transition: width 200ms ease; width: 0%;
}

/* Submit row */
.submit-row {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 0 0;
}
.btn-post {
  font-family: "Geist Mono", monospace;
  font-size: 10px; letter-spacing: 0.08em;
  color: #111; border: 1px solid #e0e0e0;
  padding: 7px 18px; border-radius: 2px;
  transition: border-color 120ms;
}
.btn-post:hover { border-color: #111; }
.btn-post:disabled { color: #ccc; border-color: #eee; cursor: not-allowed; }
.submit-msg {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #aaa;
}
.submit-msg.ok { color: #2a9; }
.submit-msg.err { color: #c00; }

/* ── List ───────────────────────────────────────────────────────────────── */
.list-section { margin-top: 32px; }
.list-row {
  display: flex; align-items: center;
  border-bottom: 1px solid #f4f4f4;
  padding: 10px 0; gap: 12px;
}
.list-thumb {
  width: 36px; height: 36px; flex-shrink: 0;
  border-radius: 2px; overflow: hidden;
  background: #f5f5f5;
  display: flex; align-items: center; justify-content: center;
}
.list-thumb img, .list-thumb video {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.list-thumb-ph {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #ccc; text-align: center;
}
.list-body { flex: 1; min-width: 0; }
.list-title {
  font-size: 13px; font-weight: 400; color: #111;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 2px;
}
.list-meta {
  font-family: "Geist Mono", monospace;
  font-size: 9px; color: #ccc; letter-spacing: 0.04em;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.list-del {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #ddd; flex-shrink: 0;
  transition: color 120ms;
  padding: 4px 0;
}
.list-del:hover { color: #c00; }
.list-empty {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #ddd; padding: 32px 0; text-align: center;
  letter-spacing: 0.06em;
}
.list-loading {
  font-family: "Geist Mono", monospace;
  font-size: 10px; color: #e8e8e8; padding: 24px 0; text-align: center;
}
</style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <div class="login-inner">
    <div class="login-site">sovereign archive — admin</div>
    <div class="login-row">
      <label>email</label>
      <input type="email" id="loginEmail" autocomplete="email" spellcheck="false"/>
    </div>
    <div class="login-row">
      <label>password</label>
      <input type="password" id="loginPassword" autocomplete="current-password"/>
    </div>
    <div class="login-actions">
      <div class="login-error" id="loginError"></div>
      <button class="btn-submit" id="loginSubmit">enter</button>
    </div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="header">
    <span class="header-title">sovereign — admin</span>
    <div class="header-actions">
      <button class="header-tab active" data-tab="projects">projects</button>
      <button class="header-tab" data-tab="notes">notes</button>
      <button class="header-signout" id="signOutBtn">sign out</button>
    </div>
  </div>

  <!-- Projects panel -->
  <div class="panel active" id="panelProjects">
    <div class="section-label">new project</div>

    <div class="form-row">
      <span class="form-label">title</span>
      <input class="form-input" type="text" id="projTitle" placeholder="untitled"/>
    </div>

    <div class="tags-row" id="projTagsRow">
      <span class="form-label" style="padding-top:3px;">tags</span>
      <div class="tags-chips" id="projTagsChips">
        <input class="tags-input-inline" id="projTagsInput" placeholder="add tag…"/>
      </div>
    </div>

    <div class="file-row" id="projFileRow">
      <span class="file-label-col">media</span>
      <div class="file-pick">
        <input type="file" id="projFile" accept="image/*,video/*"/>
        choose file

    <div class="form-row">

      <button class="btn-post" id="projSubmit">post</button>
      <span class="submit-msg" id="projMsg"></span>

      <div class="section-label">all projects</div>

  <!-- Notes panel -->
  <div class="panel" id="panelNotes">

    <div class="file-row" id="noteFileRow">
      <span class="file-label-col">media</span>
      <div class="file-pick">
        <input type="file" id="noteFile" accept="image/*,video/*,audio/*"/>
        choose file

      <span class="file-name" id="noteFileName">—</span>
      <button class="file-clear" id="noteFileClear" style="display:none">×</button>
    </div>
    <div class="file-preview" id="noteFilePreview"></div>
    <div class="progress-row" id="noteProgressRow">
      <div class="progress-track"><div class="progress-fill" id="noteProgressFill"></div></div>
    </div>

    <div class="submit-row">
      <button class="btn-post" id="noteSubmit">post</button>
      <span class="submit-msg" id="noteMsg"></span>
    </div>

    <div class="list-section">
      <div class="section-label">all notes</div>
      <div id="noteList"><div class="list-loading">—</div></div>
    </div>

</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>
/* ── Firebase init ──────────────────────────────────────────────────────── */
const firebaseConfig = {
  apiKey:            "AIzaSyBt8YrBaUZYdHVh_L7xli0HKm7EfX6n_BI",
  authDomain:        "projectp-fc779.firebaseapp.com",
  projectId:         "projectp-fc779",
  storageBucket:     "projectp-fc779.firebasestorage.app",
  messagingSenderId: "554116936611",
  appId:             "1:554116936611:web:86bf455fbd763a149de016",
};
const ADMIN_EMAIL = "paulody1021@gmail.com";

firebase.initializeApp(firebaseConfig);
const auth    = firebase.auth();
const db      = firebase.firestore();
const storage = firebase.storage();

/* ── Auth ───────────────────────────────────────────────────────────────── */
const loginScreen = document.getElementById("loginScreen");
const appEl       = document.getElementById("app");
let listenersReady = false;

const loginSubmitBtn = document.getElementById("loginSubmit");
document.getElementById("loginPassword").addEventListener("keydown", e => {
  if (e.key === "Enter") loginSubmitBtn.click();
});

loginSubmitBtn.addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value.trim();
  const pass  = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  loginSubmitBtn.disabled = true;
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch {
    errEl.textContent = "incorrect email or password";
    loginSubmitBtn.disabled = false;
  }
});

document.getElementById("signOutBtn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(user => {
  if (user && user.email === ADMIN_EMAIL) {
    loginScreen.style.display = "none";
    appEl.classList.add("visible");
    if (!listenersReady) { listenersReady = true; initAll(); }
  } else {
    loginScreen.style.display = "";
    appEl.classList.remove("visible");
  }
});

/* ── Tabs ───────────────────────────────────────────────────────────────── */
document.querySelectorAll(".header-tab[data-tab]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".header-tab[data-tab]").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel" + btn.dataset.tab[0].toUpperCase() + btn.dataset.tab.slice(1)).classList.add("active");
  });
});

/* ── Helpers ────────────────────────────────────────────────────────────── */
function detectType(file) {
  if (file.type.startsWith("image/")) return "image";
  if (file.type.startsWith("video/")) return "video";
  if (file.type.startsWith("audio/")) return "audio";
  return "other";
}

function timeStr(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString([], { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}

/* Upload with progress — returns download URL */
async function uploadFile(file, fillEl, rowEl) {
  const path = `uploads/${Date.now()}_${file.name}`;
  const ref  = storage.ref(path);
  const task = ref.put(file);
  rowEl.style.display = "block";
  await new Promise((res, rej) => {
    task.on("state_changed",
      snap => { fillEl.style.width = (snap.bytesTransferred / snap.totalBytes * 100) + "%"; },
      rej, res
    );
  });
  rowEl.style.display = "none";
  fillEl.style.width = "0%";
  return task.snapshot.ref.getDownloadURL();
}

/* File picker setup: returns { getFile, clear } */
function setupFilePicker(inputId, nameId, clearId, previewId) {
  const input   = document.getElementById(inputId);
  const nameEl  = document.getElementById(nameId);
  const clearEl = document.getElementById(clearId);
  const preview = document.getElementById(previewId);

  function clear() {
    input.value = "";
    nameEl.textContent = "—";
    clearEl.style.display = "none";
    preview.style.display = "none";
    preview.innerHTML = "";
  }

  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    nameEl.textContent = file.name;
    clearEl.style.display = "";
    // preview
    const type = detectType(file);
    const url  = URL.createObjectURL(file);
    preview.innerHTML = "";
    if (type === "image") {
      const img = document.createElement("img"); img.src = url; preview.appendChild(img);
    } else if (type === "video") {
      const vid = document.createElement("video"); vid.src = url; vid.controls = true; vid.muted = true; preview.appendChild(vid);
    }
    preview.style.display = preview.children.length ? "block" : "none";
  });

  clearEl.addEventListener("click", clear);
  return { getFile: () => input.files[0] || null, clear };
}

/* Textarea auto-height */
function autoHeight(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}

/* Tags input: returns { getTags, clearTags } */
function setupTags(chipsId, inputId) {
  const chips = document.getElementById(chipsId);
  const input = document.getElementById(inputId);
  let tags = [];

  function render() {
    chips.querySelectorAll(".tag-chip").forEach(el => el.remove());
    tags.forEach((t, i) => {
      const chip = document.createElement("span");
      chip.className = "tag-chip";
      chip.innerHTML = `${t}<span class="tag-chip-rm" data-i="${i}">×</span>`;
      chip.querySelector(".tag-chip-rm").addEventListener("click", () => { tags.splice(i,1); render(); });
      chips.insertBefore(chip, input);
    });
  }

  input.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === ",") && input.value.trim()) {
      e.preventDefault(); tags.push(input.value.trim()); input.value = ""; render();
    }
    if (e.key === "Backspace" && !input.value && tags.length) { tags.pop(); render(); }
  });

  return {
    getTags:   () => [...tags],
    clearTags: () => { tags = []; render(); }
  };
}

/* Render a list row */
function listRow(data, id, collection) {
  const row = document.createElement("div");
  row.className = "list-row";

  const thumb = document.createElement("div");
  thumb.className = "list-thumb";
  const imgUrl = data.mediaUrl || (data.attachments && data.attachments[0] && data.attachments[0].url);
  const imgType = data.mediaType || (data.attachments && data.attachments[0] && data.attachments[0].type);
  if (imgUrl && imgType === "image") {
    const img = document.createElement("img"); img.src = imgUrl; thumb.appendChild(img);
  } else if (imgUrl && imgType === "video") {
    const vid = document.createElement("video"); vid.src = imgUrl; vid.muted = true; thumb.appendChild(vid);
  } else {
    const ph = document.createElement("div"); ph.className = "list-thumb-ph";
    ph.textContent = (data.title || data.text || "?")[0].toUpperCase(); thumb.appendChild(ph);
  }

  const body = document.createElement("div");
  body.className = "list-body";
  const title = document.createElement("div");
  title.className = "list-title";
  title.textContent = data.title || (data.text || "").slice(0,60) || "(empty)";
  const meta = document.createElement("div");
  meta.className = "list-meta";
  const tags = (data.tags || []).map(t => `<span>${t}</span>`).join("");
  meta.innerHTML = `<span>${timeStr(data.createdAt)}</span>${tags}`;
  body.appendChild(title); body.appendChild(meta);

  const del = document.createElement("button");
  del.className = "list-del"; del.textContent = "delete";
  del.addEventListener("click", async () => {
    if (!confirm("Delete?")) return;
    await db.collection(collection).doc(id).delete();
  });

  row.appendChild(thumb); row.appendChild(body); row.appendChild(del);
  return row;
}

/* ── Init (after login) ─────────────────────────────────────────────────── */
function initAll() {
  /* Textareas */
  ["projDesc","noteText"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("input", () => autoHeight(el));
  });

  /* File pickers */
  const projFile = setupFilePicker("projFile","projFileName","projFileClear","projFilePreview");
  const noteFile = setupFilePicker("noteFile","noteFileName","noteFileClear","noteFilePreview");

  /* Tags */
  const projTags = setupTags("projTagsChips","projTagsInput");

  /* ── Project submit ──────────────────────────────────────────────────── */
  document.getElementById("projSubmit").addEventListener("click", async () => {
    const title = document.getElementById("projTitle").value.trim();
    const desc  = document.getElementById("projDesc").value.trim();
    const tags  = projTags.getTags();
    const file  = projFile.getFile();
    const msgEl = document.getElementById("projMsg");
    const btn   = document.getElementById("projSubmit");

    if (!title) { msgEl.textContent = "title required"; msgEl.className = "submit-msg err"; return; }

    btn.disabled = true;
    msgEl.textContent = file ? "uploading…" : "saving…";
    msgEl.className = "submit-msg";

    try {
      let mediaUrl = null, mediaType = null;
      if (file) {
        mediaUrl  = await uploadFile(file, document.getElementById("projProgressFill"), document.getElementById("projProgressRow"));
        mediaType = detectType(file);
      }
      await db.collection("projects").add({
        title, desc, tags, mediaUrl, mediaType,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        author: auth.currentUser.email,
      });
      document.getElementById("projTitle").value = "";
      document.getElementById("projDesc").value  = "";
      autoHeight(document.getElementById("projDesc"));
      projTags.clearTags();
      projFile.clear();
      msgEl.textContent = "posted"; msgEl.className = "submit-msg ok";
      setTimeout(() => { msgEl.textContent = ""; msgEl.className = "submit-msg"; }, 3000);
    } catch (e) {
      msgEl.textContent = e.message; msgEl.className = "submit-msg err";
    } finally {
      btn.disabled = false;
    }
  });

  /* ── Note submit ─────────────────────────────────────────────────────── */
  document.getElementById("noteSubmit").addEventListener("click", async () => {
    const text  = document.getElementById("noteText").value.trim();
    const file  = noteFile.getFile();
    const msgEl = document.getElementById("noteMsg");
    const btn   = document.getElementById("noteSubmit");

    if (!text && !file) { msgEl.textContent = "text or file required"; msgEl.className = "submit-msg err"; return; }

    btn.disabled = true;
    msgEl.textContent = file ? "uploading…" : "saving…";
    msgEl.className = "submit-msg";

    try {
      let attachments = [];
      if (file) {
        const url  = await uploadFile(file, document.getElementById("noteProgressFill"), document.getElementById("noteProgressRow"));
        attachments = [{ url, type: detectType(file), name: file.name }];
      }
      await db.collection("notes").add({
        text, attachments,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        author: auth.currentUser.email,
      });
      document.getElementById("noteText").value = "";
      autoHeight(document.getElementById("noteText"));
      noteFile.clear();
      msgEl.textContent = "posted"; msgEl.className = "submit-msg ok";
      setTimeout(() => { msgEl.textContent = ""; msgEl.className = "submit-msg"; }, 3000);
    } catch (e) {
      msgEl.textContent = e.message; msgEl.className = "submit-msg err";
    } finally {
      btn.disabled = false;
    }
  });

  /* ── Realtime lists ──────────────────────────────────────────────────── */
  db.collection("projects").orderBy("createdAt","desc").onSnapshot(snap => {
    const el = document.getElementById("projList");
    el.innerHTML = "";
    if (snap.empty) { el.innerHTML = '<div class="list-empty">no projects yet</div>'; return; }
    snap.forEach(d => el.appendChild(listRow(d.data(), d.id, "projects")));
  });

  db.collection("notes").orderBy("createdAt","desc").onSnapshot(snap => {
    const el = document.getElementById("noteList");
    el.innerHTML = "";
    if (snap.empty) { el.innerHTML = '<div class="list-empty">no notes yet</div>'; return; }
    snap.forEach(d => el.appendChild(listRow(d.data(), d.id, "notes")));
  });
}
</script>
</body>
</html>
